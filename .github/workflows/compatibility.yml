name: Rouge compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * 1'
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  latest-rouge:
    name: Latest Rouge compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle update rouge
      - run: bundle exec ruby script/compatibility --write
      - run: bundle exec rake test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rouge-compatibility
          path: |
            lib/antares/compatibility.rb
            docs/compatibility.md
