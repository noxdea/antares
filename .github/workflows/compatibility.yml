name: Rouge compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  latest-rouge:
    name: Latest Rouge compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle update rouge
      - run: bundle exec ruby script/compatibility --write
      - run: bundle exec rake test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rouge-compatibility
          path: |
            lib/antares/compatibility.rb
            docs/compatibility.md
